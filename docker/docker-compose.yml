version: '3.8'

services:
  agentos:
    build: .
    container_name: agentos-runtime
    restart: unless-stopped
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
    
    # Mount environment file
    env_file:
      - .env
    
    # Volumes for persistence
    volumes:
      - agentos_data:/home/agentos/.agentos
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker isolation
    
    # Security
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import agentos; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentos_data:
    driver: local